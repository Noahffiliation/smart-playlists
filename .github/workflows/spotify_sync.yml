name: Spotify Playlist Sync

on:
  # schedule:
  #   # Runs at 11:01 PM Central during Daylight Saving Time (March to November)
  #   # 04:01 UTC
  #   - cron: '0 5 * 3-11 *'

  #   # Runs at 11:01 PM Central during Standard Time (November to March)
  #   # 05:01 UTC
  #   - cron: '0 6 * 1-3,11-12 *'
  workflow_dispatch:

concurrency:
  group: spotify-playlist-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-sync:
    name: Sync Spotify Playlists
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --frozen --no-dev

      - name: Validate secrets
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SPOTIFY_CACHE_B64: ${{ secrets.SPOTIFY_CACHE_B64 }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$SPOTIFY_CACHE_B64" ]; then
            echo "Error: Required Spotify credentials or cache secret are missing." >&2
            exit 1
          fi

      - name: Restore Spotify Cache
        env:
          SPOTIFY_CACHE_B64: ${{ secrets.SPOTIFY_CACHE_B64 }}
        run: |
          echo "$SPOTIFY_CACHE_B64" | tr -d '\n\r ' | base64 --decode > .cache

      - name: Execute Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          SOURCE_PLAYLIST_IDS: ${{ secrets.SOURCE_PLAYLIST_IDS }}
          TARGET_PLAYLIST_NAME: ${{ secrets.TARGET_PLAYLIST_NAME }}
          TOP_25_PLAYLIST_NAME: ${{ secrets.TOP_25_PLAYLIST_NAME }}
          BOTTOM_25_PLAYLIST_NAME: ${{ secrets.BOTTOM_25_PLAYLIST_NAME }}
        run: uv run smart_playlists.py

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🎵 Spotify Playlist Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Sync Outcome** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Log Artifact** | \`spotify-sync-logs\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "logs" ] && [ -n "$(ls -A logs/*.log 2>/dev/null)" ]; then
            echo "📄 Generated execution logs:" >> $GITHUB_STEP_SUMMARY
            ls -lh logs/*.log | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Execution Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: spotify-sync-logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 7
