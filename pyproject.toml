[project]
name = "smart-playlists"
version = "0.1.0"
description = "Generate and sync smart Spotify playlists based on listening history and releases"
requires-python = ">=3.12"
dependencies = [
    "httpcore2>=2.12.0",
    "pylast>=7.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "spotipy>=2.25.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "BLE001", # Blind exception catching (needed for Spotify / Last.fm API rate limit fallbacks)
    "RUF001", # Ambiguous characters (music track titles often contain Unicode symbols)
]

[tool.ruff.lint.isort]
known-first-party = ["smart_playlists", "new_releases", "utils"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
