[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "BLE001", # Blind exception catching (needed for Spotify / Last.fm API rate limit fallbacks)
    "RUF001", # Ambiguous characters (music track titles often contain Unicode symbols)
]

[tool.ruff.lint.isort]
known-first-party = ["smart_playlists", "new_releases", "utils"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
